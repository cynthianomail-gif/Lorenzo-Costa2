<!DOCTYPE html>
<meta charset="utf-8">
<title>亞格號 V3 賠率係數校準掃描</title>
<body>
<pre id="calib">RUNNING</pre>
<script src="sim-v3-core.js"></script>
<script>
/* =========================================================================
   V3 賠率係數校準掃描（2026-08-07）
   目的：找出讓 RTP 逼近但不超過 98.5% 上限的 PAYOUTS 等比縮放係數。
   規格（使用者已確認）：
     - RTP 分母 = NG 局數 × 押注（FG/SFG 免費局不計入分母）
       ※ SimV3.runMonteCarlo 的 rtp 欄位分母即為 n×bet（n = 押注筆數 = NG 局數），符合此定義
     - JP 彩金完全排除在 RTP 分子與分母之外，只統計觸發次數
     - 目標上限 98.5%
   注意：calcWin 的 Math.floor() 在係數相乘「之後」，係數愈小捨去的相對損失愈大，
        故 RTP 對係數並非嚴格線性 —— 必須實掃，不能用比例外推。
   ========================================================================= */
const BET  = 100;
const CAP  = 0.985;          // RTP 上限（ratio）
const out  = { meta: {}, sanity: null, coarse: [], fine: [], best: null, error: null };
const t0   = Date.now();

// 單點：跑 n 筆押注，回傳 RTP 與 95% 信賴區間（用押注得分的組內標準差推）
function runPoint(coef, n, seed) {
  const r = SimV3.runMonteCarlo(n, BET, { seed, payoutCoef: coef });
  const rtp = r.rtp.rtp;                       // ratio，1.0 = 100%
  const sd  = r.wager.sd;                      // 單筆押注得分的標準差
  const se  = sd / Math.sqrt(n) / BET;         // RTP 的標準誤（ratio）
  return {
    coef, n, seed, rtp,
    ci95: 1.96 * se,
    rtpPct: rtp * 100,
    ci95Pct: 1.96 * se * 100,
    ngOnly: r.rtp.ngOnly, fgPart: r.rtp.fgPart, sfgPart: r.rtp.sfgPart,
    ngHitRate: r.ng.hitRate, fgRate: r.trigger.fgRate, sfgRate: r.trigger.sfgRate,
    jpOneIn: r.jp.oneIn, jpCount: r.jp.count,
    elapsedMs: r.meta.elapsedMs,
    full: null,
  };
}

try {
  // ---- 0. 健全性檢查：係數必須真的生效（前一版是空殼，改完要證明它會動）----
  const sA = runPoint(1.0,  20000, 777);
  const sB = runPoint(0.5,  20000, 777);
  const sC = runPoint(0.25, 20000, 777);
  out.sanity = {
    desc: '同一 seed 下，係數 1 / 0.5 / 0.25 的 RTP 應約略等比下降（floor 造成略低於等比）',
    rtp1: sA.rtp, rtp05: sB.rtp, rtp025: sC.rtp,
    ratio_05: sB.rtp / sA.rtp, ratio_025: sC.rtp / sA.rtp,
    expect_05: 0.5, expect_025: 0.25,
    pass: (sB.rtp / sA.rtp) > 0.45 && (sB.rtp / sA.rtp) <= 0.505
       && (sC.rtp / sA.rtp) > 0.20 && (sC.rtp / sA.rtp) <= 0.255,
  };

  // ---- 1. 粗掃：以「讓 RTP≈98.5% 的線性估計值」為中心，涵蓋 0.3~3 倍 ----
  const base = runPoint(1.0, 200000, 20260807);   // 原始賠率的基準 RTP
  out.meta.baseRtp = base.rtp;
  const est = CAP / base.rtp;                      // 線性粗估係數
  out.meta.linearEstimate = est;

  const mults = [0.3, 0.5, 0.7, 0.85, 1.0, 1.15, 1.3, 1.6, 2.0, 3.0];
  for (const m of mults) {
    out.coarse.push(runPoint(est * m, 200000, 20260807));
  }

  // ---- 2. 細掃：在粗掃結果中挑出跨越 98.5% 的區間，加密取樣並拉高 N ----
  const sorted = out.coarse.slice().sort((a, b) => a.coef - b.coef);
  let lo = null, hi = null;
  for (let i = 0; i < sorted.length - 1; i++) {
    if (sorted[i].rtp <= CAP && sorted[i + 1].rtp > CAP) { lo = sorted[i]; hi = sorted[i + 1]; break; }
  }
  if (!lo) { lo = sorted[0]; hi = sorted[1]; }
  const fineCoefs = [];
  for (let k = 0; k <= 4; k++) fineCoefs.push(lo.coef + (hi.coef - lo.coef) * k / 4);
  for (const c of fineCoefs) out.fine.push(runPoint(c, 600000, 20260807));

  // ---- 3. 選定建議係數：RTP 上界（rtp + ci95）仍不超過 98.5% 的最大係數 ----
  const cand = out.fine.slice().sort((a, b) => a.coef - b.coef)
                       .filter(p => p.rtp + p.ci95 <= CAP);
  const pick = cand.length ? cand[cand.length - 1] : out.fine.slice().sort((a, b) => a.rtp - b.rtp)[0];

  // 建議係數再跑一次高精度全統計，供報表使用
  const fullRun = SimV3.runMonteCarlo(1000000, BET, { seed: 20260807, payoutCoef: pick.coef });
  out.best = {
    coef: pick.coef,
    rtp: fullRun.rtp.rtp,
    ci95: 1.96 * (fullRun.wager.sd / Math.sqrt(1000000) / BET),
    n: 1000000,
    full: fullRun,
  };

  out.meta.totalElapsedSec = (Date.now() - t0) / 1000;
  out.meta.cap = CAP;
  out.meta.bet = BET;
} catch (e) {
  out.error = String(e && e.stack || e);
}
document.getElementById('calib').textContent = 'JSONSTART' + JSON.stringify(out) + 'JSONEND';
</script>
</body>
